<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE CADASTRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>SISTEMA DE CADASTRO PARTE 2</h1>

    <form>
        <input type="text" id="nome" placeholder="Nome">

        <input type="number" id="preco" placeholder="Preço">

        <input type="text" id="categoria" placeholder="Categoria">

        <input type="number" id="desconto" placeholder="Desconto em %">

        <button type="button" id="botaoCadastrar">
            Cadastrar
        </button>
        <button type="button" id="botaoExcluirTodos">Excluir Todos os Produtos</button>

    </form>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>
</html>
